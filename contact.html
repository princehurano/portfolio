<header class="site-header">

    <a href="index.html" class="site-title">Website sa Gwapo<span>.</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>

      <a href="gallery.html">Gallery</a>

    </nav>
  </div>
</header>

<main>
  <h1 class="page-title">Contact Me</h1>

  <div class="card">
    <p>Have a question or just want to say hi? Fill out the form below.</p>
    <p>Email me direclty here: <strong>prince.hurano@lccdo.edu.ph</strong></p>
    
    <form class="contact-form" action="#">
      <div class="form-field">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Type here..." required>
      </div>

      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Type here..." required>
      </div>

      <div class="form-field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Type here..." required>
      </div>

      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn--submit">Submit</button>
        <button type="reset" class="btn btn--reset">Reset</button>
      </div>
    </form>
  </div>
</main>

<footer class="site-footer">
